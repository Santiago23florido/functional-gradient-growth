# Train the four discovered architectures from random initialization, without
# growth, on exactly the headline smooth_sin split (1024/1024/8192 points).
base_config: configs/fgd/family_ladder_N1024.yaml
results_dir: results/grid_search_fixed_architectures

architectures:
  - [11, 19, 16]
  - [12, 17, 18]
  - [13, 19, 14]
  - [9, 16, 22]

# train_seed remains fixed at 0 through the base config.  These seeds only
# initialize the fixed network, matching the headline experiment.
model_seeds: [0, 1, 2, 3]

# Conditional spaces avoid wasting trials on learning rates that make sense
# for one optimizer but not the other. Every run is 70 epochs.
search_spaces:
  - optimizer.name: [adamw]
    optimizer.learning_rate: [0.001, 0.003, 0.01]
    optimizer.weight_decay: [0.0, 0.001, 0.01]
    lr_scheduler.name: [none, cosineannealing]
  - optimizer.name: [sgd]
    optimizer.learning_rate: [0.01, 0.03, 0.1]
    optimizer.momentum: [0.0, 0.9]
    optimizer.weight_decay: [0.0, 0.001]
    lr_scheduler.name: [none, cosineannealing]

fixed_overrides:
  training.epochs: 70
  training.gradient_clip_norm: null
  lr_scheduler.t_max: 70
  lr_scheduler.eta_min: 0.0
  lr_scheduler.restart_on_growth: false
