# Nonlinear-primary N=1024 experiment, derived from family_ladder_N1024.yaml.
#
# Hyperparameters changed relative to that configuration:
#   * run.name: identifies the nonlinear experiment.
#   * fgd_approx.family_order: [tangent] -> [nonlinear].
#   * parametric_gd.optimizer: sgd -> adamw (the nonlinear primary always uses
#     AdamW; this makes the experiment declaration explicit).
#   * parametric_gd.inner_learning_rate: 0.05 -> 0.003.
#   * parametric_gd.inner_steps: [16, 64] -> [16, 64, 256]. In nonlinear
#     primary mode these are bounded AdamW optimizer-step budgets, not full
#     dataset passes (1, 4 and 16 N1024 minibatch epochs respectively).
#   * parametric_gd.functional_learning_rates: [0.2, 0.05] -> [0.5].
#   * parametric_gd.weight_decay: 0.0 -> 0.05.
#   * wandb.group/tags/notes: identify this three-seed nonlinear experiment.
#
# The AdamW values are the conservative existing values from this repository's
# parametric_descent nonlinear candidate (not dataset-specific inventions).
# Tangent-only projection/Jacobian controls are intentionally omitted because
# the standalone nonlinear primary branch never reads or executes them.

run:
  name: nonlinear_family_ladder_N1024_2x2x2
  results_dir: results
  save_plot: false
  show_plot: false

# Preserved exactly from family_ladder_N1024.yaml (N = 16 * 64 = 1024).
data:
  kind: smooth_sin
  in_features: 4
  out_features: 1
  train_batches: 16
  validation_batches: 16
  test_batches: 128
  batch_size: 64
  train_seed: 0
  validation_seed: 2
  test_seed: 1
  active_features: 3
  frequency: 1.5
  phase_shift: 0.5
  interaction_strength: 0.25
  linear_strength: 0.1

# Required initial hidden architecture: 2-2-2.
model:
  hidden_size: 2
  number_hidden_layers: 3
  model_seed: 0

training:
  method: fgd_approx
  epochs: 25
  accuracy_tolerance: 0.1
  gradient_clip_norm:
  log_every: 1
  device: auto

# Rebuilt after structural growth. Candidate optimization is configured below
# and always uses AdamW independently of this outer optimizer.
optimizer:
  name: sgd
  learning_rate: 0.01
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false
  betas: [0.9, 0.999]
  eps: 1.0e-8

lr_scheduler:
  name: cosineannealing
  t_max: 50
  eta_min: 0.0
  restart_on_growth: true

fgd_approx:
  family_order:
    - nonlinear
  functional_loss: mse
  rel_error_threshold: 0.5
  learning_rate_policy: theory_interval
  theory_smoothness_constant: 2.0
  theory_alpha: 1.0
  theory_beta: 1.0
  theory_mu: 2.0
  theory_loss_star: 0.0
  theory_lr_safety: 0.95
  theory_lr_initial: 0.01
  theory_lr_min: 1.0e-5
  local_acceptance_conditions: true
  eps: 1.0e-12

  # A failed nonlinear ladder directly requests one bounded structural event.
  certify_max_growths: 200
  max_total_parameters:
  growth_where: expressivity_bottleneck
  growth_selection: unified_expansion
  growth_function_preserving: true
  growth_preservation_tolerance: 1.0e-6
  growth_compute_delta: false
  tiny_use_covariance: true
  tiny_alpha_zero: false
  tiny_omega_zero: false
  tiny_use_projection: true
  tiny_ignore_singular_values: false
  tiny_use_fisher: false
  tiny_maximum_added_neurons: 1
  tiny_numerical_threshold: 1.0e-6
  tiny_statistical_threshold: 1.0e-3

  # Existing nonlinear plateau support; disabled to retain the full configured
  # inner budget unless explicitly enabled in a follow-up experiment.
  certify_family_plateau_stop: false
  certify_family_plateau_tol: 0.002

parametric_gd:
  optimizer: adamw
  inner_learning_rate: 0.003
  inner_steps: [16, 64, 256]
  functional_learning_rates: [0.5]
  min_cosine: 0.9
  parameter_penalty: 1.0e-6
  gradient_clip_norm: 1.0
  weight_decay: 0.05
  # Stream the complete validation loader using scalar sufficient statistics;
  # set a positive integer to cap certification minibatches if needed.
  certification_batches:

scaling_line_search:
  method: golden_section
  min_value: 0.0
  max_value: 1.0
  iterations: 12
  tolerance: 0.001

growth_schedule:
  enabled: true
  every: 100
  first_epoch: 50
  layer_policy: round_robin

wandb:
  enabled: true
  project: stable-tiny
  entity:
  run_name:
  group: nonlinear-n1024-2x2x2-3seeds
  job_type: train
  tags: [fgd_approx, nonlinear, certified_growth, smooth_sin_tiny, from_2x2x2]
  notes: Nonlinear-only certified AdamW minibatch family; no tangent construction
  mode: online
  dir: results
  log_code: false
