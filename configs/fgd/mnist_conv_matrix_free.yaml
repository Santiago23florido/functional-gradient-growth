# The family_ladder_N1024 base ladder, with J built matrix-free.
#
# Derived from configs/fgd/family_ladder_N1024.yaml. The dense/exact file is
# untouched; this file explicitly opts into the matrix-free operator plus its
# own rate grid, cap and realized-endpoint transaction. Shared defaults remain
# off, so running family_ladder_N1024.yaml is unaffected.
#
# The point is MNIST, not this task: the exact route forms the O(P^2) Gram,
# which at MNIST width is ~40 GB and simply cannot run. This one never
# materialises it.
#
# It IS an approximation and the bias is one-sided -- while k < rank(J) the
# retained subspace cannot see the directions outside it, so eps looks better
# than it is. MEASURED at P=25, k=24: 0.8104 against the true 0.8779. k is
# therefore driven to the numerical rank, where the two agree.

# Grow-to-certify on the SMALLEST honest instance of the task.
#
# Same method, same exactness, sized so a step costs seconds: the point is
# to see whether computing EVERYTHING exactly -- full Jacobian over the
# whole training set, exact projection, certified rate, step integrated to
# completion -- actually improves accuracy, before paying for that at
# scale.
#
# One output and 256 training samples give a 256 x P Jacobian, so:
#   * probe_batches covers the ENTIRE training set (no subsample, and hence
#     none of the interpolate-your-own-probe failure),
#   * no row-chunking is needed at all,
#   * the certificate eps < 1/2 is a statement about 256 equations, which
#     the network must satisfy honestly rather than by having more
#     parameters than there are constraints.
#
# Same method as certify_mnist.yaml: grow until the relative-error
# criterion holds, then train with the tangent family alone at
# eta = 0.95 * eta_bar(eps), assuming the remaining condition rather than
# verifying it, until eps stops satisfying the criterion -- then grow again.
#
# smooth_sin is the right place to see whether that CYCLE works at all: the
# target is a known smooth function, sum-MSE gives an exact function-space
# PL constant (mu = 2, L* = 0) where cross-entropy has none, and an epoch
# costs seconds instead of minutes.
run:
  name: mnist_conv_matrix_free
  results_dir: results
  save_plot: false
  show_plot: false

data:
  # MNIST as IMAGES. `mnist2d` is a separate kind from `mnist`, not a flag on
  # it, so the flat runs stay provably untouched -- and it is the same loader
  # with a reshape at the end, after the per-pixel normalisation and every
  # split draw, so the two emit the same examples in the same order with the
  # same labels and x_2d.flatten(1) == x_flat exactly. That identity is what
  # makes the linear ladder on these images a fair reference arm.
  kind: mnist2d
  in_features: 784
  input_shape: [1, 28, 28]
  out_features: 10
  # Kept explicit because the Slurm launcher replaces it with node-local
  # storage before starting the run.
  data_dir:
  batch_size: 64
  # N = 1024, the regime this whole line of work is calibrated in.
  # 10000, config 2's value. This config is the CONV COUNTERPART of
  # mnist_matrix_free.yaml, so the data has to match or the comparison against
  # it is not a comparison. An earlier version used 1024 and would have needed
  # its own linear arm run separately just to have something to measure
  # against.
  #
  # It costs less than it looks: the probe is not sized by the dataset but by
  # certify_probe_kappa from rank(J), and on conv rank sits at 200-300 and
  # FALLS as the net grows, so the probe settles near 192 images either way.
  # What grows is the full-train evaluation, which is the cheap part.
  mnist_train_samples: 10000
  mnist_validation_samples: 2000
  mnist_test_samples: 2000
  train_seed: 0
  validation_seed: 2
  test_seed: 1

model:
  # 498 parameters, three growable locations -- the same count the linear
  # reference starts with (hidden_size 2, number_hidden_layers 3).
  #
  # WHY SOME WIDTHS ARE CONFIGURED AND NOT SEARCHED. Growing a layer widens
  # its INPUT, i.e. its predecessor's output. So a width is reachable by the
  # search only if some growable layer consumes it -- and the last conv before
  # any shape change has no such consumer, because a pool or a flatten sits
  # between it and the next layer. In this stack that is B.out and D.out.
  # They are configuration, not search, and the first attempt left both at 2:
  # MEASURED, three epochs bought 290 parameters and every one of them went to
  # the head, the trunk stayed 2->2->2->2, and train_loss stalled at 0.147 --
  # ABOVE the 0.09 that predicting the class mean gives. The criterion was not
  # malfunctioning; it was correctly reporting that the head was the only
  # place with anything to buy, because 2 channels through an avgpool is 18
  # numbers and no amount of head width invents information the trunk did not
  # pass. So the two pinned widths are chosen (4 and 8) and everything the
  # search CAN reach still starts at 2.
  #
  # WHICH layers are growable is GroMo's topology, not a choice here: a layer
  # grows only when its immediate predecessor is a module of the same kind
  # with no shape change in between. So the growable set is conv B, conv D
  # and the output fc; conv A has no predecessor, conv C sits behind a pool,
  # and fc E sits behind the flatten with a conv before it (which
  # LinearGrowingModule refuses outright).
  #
  # And it is what makes the width/depth balance real rather than decorative:
  # inserting a conv between B and the pool gives B.out a growable consumer,
  # which is the ONLY way the search can ever touch it. With the balance off
  # those two widths stay exactly as configured for the whole run.
  stack:
    - {conv: [2, 3]}      # A  1 -> 2  @28    A.out is GROWABLE (via B)
    - {conv: [4, 3]}      # B  2 -> 4  @28    B.out is PINNED by the pool
    - maxpool             #    28x28 -> 14x14
    - {conv: [2, 3]}      # C  4 -> 2  @14    C.out is GROWABLE (via D)
    - {conv: [8, 3]}      # D  2 -> 8  @14    D.out is PINNED by the avgpool
    - {avgpool: [3, 3]}   #    -> 3x3, so the head sees 8*9 = 72
    - flatten
    - {mlp: [2, 1]}       # E 72 -> 2         E.out is GROWABLE (via F)
    #                       F  2 -> 10 appended
  # RestrictedConv2dGrowingModule (Conv -> 1x1) is GroMo's own default, what
  # VGG and ResNet use, and by far the better tested. "full" (Conv -> Conv)
  # is available for the A/B; it does not support tiny_use_fisher, which is
  # already false below.
  conv_growth_scheme: restricted
  model_seed: 0

training:
  method: fgd_approx
  epochs: 40
  accuracy_tolerance: 0.1
  gradient_clip_norm:
  log_every: 1
  device: auto

optimizer:
  name: sgd
  learning_rate: 0.01
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false
  betas: [0.9, 0.999]
  eps: 1.0e-8

lr_scheduler:
  name: cosineannealing
  t_max: 50
  eta_min: 0.0
  restart_on_growth: true

fgd_approx:
  rel_error_threshold: 0.5
  rel_error_mode: tangent_projection
  layer_selection: certifying
  projection_solver: exact
  learning_rate_policy: theory_interval
  projection_damping: 0.01
  cg_max_iterations: 16
  cg_tolerance: 1.0e-4
  theory_smoothness_constant: 2.0
  theory_alpha: 1.0
  theory_beta: 1.0
  theory_mu: 2.0
  theory_loss_star: 0.0
  theory_lr_safety: 0.95
  theory_lr_initial: 0.01
  theory_lr_min: 1.0e-5
  theory_lr_follow_bound: false
  # 16, not the base config's 8. When eps > 1/2 the Lemma 3.5 interval is
  # invalid -- both ladders get there, eps peaks at 1.96 exact and 1.66 here --
  # and the rate comes from the measured-descent sweep instead. That sweep is a
  # geometric grid from tangent_measured_max_lr down to theory_lr_min, so 8
  # points across FIVE orders of magnitude puts consecutive rungs 5.18x apart:
  # 1.0, 0.193, 0.037, nothing in between.
  #
  # MEASURED consequence on seed 0: epoch 23 took lr=0.2192 -- the second rung,
  # and 4x the largest step the exact ladder ever takes in 25 epochs (0.0556).
  # Accuracy fell 0.859 -> 0.766 and that single step is the WHOLE final gap
  # (0.9188 here against 0.935 exact); this run was AHEAD by up to +0.104 at
  # epoch 11. 16 rungs are 2.15x apart, so the sweep can land between 0.037 and
  # 0.193 instead of being forced onto one of them.
  #
  # Not a defect in the base config: it carries the same defaults and regresses
  # the same way (epoch 5 +0.0030, epoch 18 +0.0047, 0.756 -> 0.637). It simply
  # never hit a state where the high rung won. Fixed here only.
  theory_lr_search_steps: 16
  # Belt to the above. The exact ladder never exceeded 0.0556, so a 0.1 ceiling
  # costs nothing observed and removes the rung that produced the outlier.
  tangent_measured_max_lr: 0.1
  theory_lr_search_refinements: 4
  sufficient_descent_c: 0.1
  lr_backtrack: 0.5
  lr_min_factor: 0.001
  global_bound_action: grow
  rel_error_compute_delta: true
  growth_compute_delta: true
  projection_group_size: 1
  projection_group_auto: true
  projection_group_max:
  # Joint certification probe: number of mini-batches concatenated into the
  # FIXED probe on which every certificate solves ONE shared-direction
  # projection (the projection_group_* keys above are deprecated: they used
  # to aggregate independent per-batch projections).
  # Tractable probe. Exactness is preserved (full Jacobian, no CG); what the
  # probe size sets is the STRENGTH of the certificate -- eps < 1/2 here is a
  # statement about 64 samples x 10 classes = 640 output dimensions. Measured
  # cost: 2.4 s per exact eps at this size against 11.1 s at 4 batches, and
  # the loop pays that per candidate per growth.
  # 2 x 128 = 256 samples x 3 outputs = 768 output dimensions. Sized so the
  # loop can actually finish: the residual lives in N*K dimensions, so that
  # is how much rank the tangent space must acquire to capture 80 % of the
  # gradient energy, and the exact solver materialises a (N*K) x P Jacobian
  # per candidate per growth. At 4 x 512 = 6144 rows the run died of CUDA
  # OOM after 23 growths, with eps still at 0.545.
  # THE WHOLE TRAINING SET, not a subsample. The probe exists only because
  # materialising the exact Jacobian over all the data is usually intractable
  # -- here it is not: 10 batches x 128 = 1280 samples x 3 outputs = 3840
  # rows, so J is 3840 x P, about 61 MB in float64 at P ~ 2000.
  #
  # Using a SUBSAMPLE was the bug. Once the certified step is delivered in
  # full it becomes Newton's method on those points and interpolates them:
  # MEASURED train accuracy 0.320 against validation 0.150, with the tangent
  # relative error diverging to 1077 because RelErr = ||g - r||/||g|| blows up
  # exactly when no residual is left on the probe to approximate. With the
  # full set there is no sampling at all and the certificate is a statement
  # about the training loss itself, which is what the theory is about.
  # 11, config 2's value, not config 1's 16. This is an MNIST-scale knob and
  # this config runs on MNIST: NK = 11 * 64 * 10 = 7040 rows instead of 10240,
  # which is a third off every factor and every probe forward.
  probe_batches: 11
  # Assemble that Jacobian in row-blocks. jacrev vmaps one backward pass per
  # output row and holds the batched activations for all of them at once, so
  # its peak scales with (rows) x (activations), not with J. MEASURED: the
  # 3840 x ~600 Jacobian is only ~9 MB and computing it in ONE call still ran
  # the GPU out of memory -- the matrix was never the problem. Blocks rebuild
  # the identical matrix (tests/test_jacobian_chunking.py) at a bounded peak,
  # for one extra forward per block. This is what makes certifying over the
  # whole dataset affordable rather than over a subsample.
  # 32, and the value is MEASURED AT THE PROBE THE RUN ACTUALLY USES, which
  # is the mistake the first attempt made. certify_probe_kappa shrinks the
  # probe at run time -- NK settles at 1920, not the 7040 that probe_batches
  # would give -- so calibrating the chunks against the full probe made both
  # of them ~4x tighter than necessary and cost 4.5x on every certificate.
  #
  # At NK = 1920, P = 544: rows 8 -> 4.5 s, rows 32 -> 1.0 s, rows 64 -> 1.0 s
  # at twice the memory, rows 128 -> OOM. 32 is where the curve flattens.
  jacobian_row_chunk: 32
  # Bound how many directions ride through ONE vmap on the matrix-free path.
  # The range finder asks for rank + oversampling of them, which is of order
  # P, and vmap holds every direction's FULL forward activations at once. On
  # an MLP an activation is (N, width); on a conv it is (N, C, H, W) -- larger
  # by the spatial extent. MEASURED here: 1024 images x 2 channels x 28 x 28 x
  # 8 bytes is 12.8 MB PER DIRECTION PER LAYER, so the block at the 2500
  # parameter budget asks for tens of GB and takes the machine down. That is a
  # defect of the approximation, not a cost of the problem: 1024 tiny images
  # and 2500 parameters do not need that memory.
  #
  # Chunking is EXACTLY equivalent -- the directions in a block are
  # independent -- so this changes the footprint and nothing else.
  # 32, measured at the same real probe. Unlike the row chunk this one barely
  # affects time (the solve is 5.8 s at chunk 8 and 4.2 s at 32), so raising
  # it buys little and only costs memory -- 1.11 GB at 32 against 2.15 GB at
  # 64 for the same speed, and 128 OOMs on the 8 GB card.
  matrix_free_block_chunk: 32
  # A rejected fallback family is skipped until this many ACCEPTED outer
  # steps have been committed since the rejection (weight updates change the
  # tangent space, so rejection is never permanent at a fixed architecture).
  # Growth clears all rejection state immediately; 0 retries every epoch.
  family_rejection_cooldown: 0
  # Acceptance mode. true: an outer step commits on its four LOCAL
  # conditions only (valid sensor, strict RelErr < 0.5, strict LR interval
  # theory_lr_min < eta < eta_bar, STRICT realized validation descent) and
  # the stationary/global bounds are computed and logged as trajectory
  # diagnostics. false (default): legacy behavior — non-strict descent and
  # Cstat/Cglob as acceptance gates.
  outer_steps_per_epoch: 8
  growth_patience: 1
  # Certified functional: cross-entropy keeps convexity (global optimality)
  # and is 4x smoother than MSE (wider admissible interval), but has NO
  # global PL constant, so the C_glob linear envelope is left undefined.
  # See report/CROSS_ENTROPY_FGD.md.
  functional_loss: mse
  # Cross-entropy's infimum is not attained (f_c -> inf), so SOME family
  # step always certifies. Without this the structural step would be
  # postponed for ever while the network stays inadequate. Self-limiting
  # through eps -- no parameter budget involved.
  admissibility_failure_forces_growth: false
  growth_limit_criterion: epsilon_stationary
  # SENN's where (arXiv:2307.04526). Locations are ranked by the natural
  # expansion score -- GroMo's sum(eigenvalues_extension^2), which is the
  # extension's first-order loss decrease -- and capacity is added at the
  # argmax, with the scores RECOMPUTED after each addition (their Ingredient
  # 4 adds and repeats). The addition budget per growth event equals the
  # number of growable layers, exactly what uniform widening spends, so the
  # comparison against search_ce_uniform.yaml isolates the ALLOCATION.
  # GROW-TO-CERTIFY: grow until Lemma 3.5 holds, then step. Only the tangent
  # family, only steps the 1/2 condition certifies. Parameter count is
  # explicitly NOT a concern -- the question is whether exact certification
  # alone reaches the best loss and accuracy.
  grow_to_certify: true
  # Sized from the MEASURED rate on this probe: eps falls ~0.0018 per growth
  # (1.824 -> 1.643 over 46), so reaching 1/2 from a 3x2 start needs ~670.
  # The reason is dimensional, not a defect: each preserving growth adds ~9
  # tangent directions while the residual lives in 64x10 = 640 dimensions, and
  # capturing 80% of the gradient energy over those needs hundreds. Parameter
  # count is deliberately not a constraint here -- the question is whether
  # exact certification, whatever it costs, delivers the best accuracy.
  certify_function_preserving: true
  certify_max_growths: 200
  # PAPER-PURE STEP. Lemma 3.5 does not offer descent as a condition to
  # verify -- it PROVES it: eps < 1/2 implies every eta in (0, eta_bar(eps))
  # descends. So the flow keeps the rate the certificate licenses (the same
  # theory_lr_safety * eta_bar the ordinary sweep would start from, 0.95 of
  # the interval) and simply applies it -- one rate, no sweep, no empirical
  # descent gate, exactly as the paper's algorithm does.
  #
  # The rate must come from THAT certificate and not be recomputed from
  # another sample. MEASURED: deriving it from the train-probe eps the grow
  # loop certifies looks like the same formula but is a different number --
  # small eps means large eta_bar, and at eps ~ 0.42 it gave eta = 0.86
  # against |u| = 15, a parameter displacement of ~13 that left the linear
  # regime and diverged (validation loss 4.1e3 -> 2.7e4 in five steps).
  # Lemma 3.5 governs a FUNCTION-space step f - eta g; what is taken is a
  # PARAMETER-space step theta - eta u, and they agree only while eta |u| is
  # small enough for f(theta - eta u) ~ f(theta) - eta J u to hold.
  #
  # Why this matters here, MEASURED: with the gate on, the flow deadlocked.
  # eps = 0.475 certified the structure so no growth fired, while no rate
  # produced held-out descent so no step committed -- epochs 2, 3 and 4 came
  # out bit-identical (loss 0.0619, acc 0.566, delta +0.0000). The gate was
  # unsatisfiable rather than informative: eps is certified on the TRAIN
  # probe and descent was demanded on the VALIDATION probe, and Lemma 3.5
  # guarantees descent only on the sample where eps was measured.
  certify_apply_in_interval: true
  # Enforce Lemma 3.5's HYPOTHESIS: that theta - eta u is the function-space
  # step f - eta g the lemma is about. Without it this exact config diverged
  # while the certificate stayed healthy -- eta rose 0.005 -> 0.855 as eps
  # FELL 0.50 -> 0.085, loss 2.3e3 -> 7.5e7, accuracy 0.087 -> 0.004 -- because
  # eta_bar(eps) -> 2/L_s as eps -> 0, so the better the certificate the larger
  # the step it authorises and the further outside the linear regime it lands.
  #
  # 0.1: the realised displacement must match the predicted one to within
  # 10 % of its size. This is not the descent check that was removed -- the
  # defect never looks at the loss (tests/test_linearization.py pins that
  # reversing the update's sign leaves it unchanged). It only narrows eta
  # INSIDE the certified interval.
  certify_linearization_tolerance: 0.1
  # Choose the projection's regularisation by measurement rather than by the
  # fixed projection_damping above. It is the knob arbitrating between the
  # certificate (eps) and the realisability of the step (|u|), and they pull
  # opposite ways -- MEASURED on one grown model here:
  #
  #   lambda 0     eps 0.045   |u| 3.6e5   no admissible rate
  #   lambda 1e-2  eps 0.495   |u| 3.9e1   eta 1.6e-4
  #   lambda 1e0   eps 0.845   |u| 4.1e0   eps >= 1/2
  #
  # Only a narrow window satisfies both, and 1e-2 lands in it by luck at THIS
  # scale of J. Selection locates the window per step and picks the rung
  # maximising eta*||g||^2, the decrease Lemma 3.5 guarantees; measured to
  # land within 9 % of the hand-tuned constant on the task it was tuned for,
  # with nothing dataset-specific in the rule.
  projection_damping_auto: true
  # Fast where: the min-damping eps that ranks growth candidates is computed by
  # a float32 SVD instead of float64 -- ~9x faster and MEASURED to pick the
  # identical growth location on every growth (30/30), the decision that
  # matters. The absolute eps can differ ~4e-2 on a rank-deficient Jacobian
  # (the near-null directions), but that offset hits all candidates equally so
  # the argmin is unchanged.
  projection_fast_factorization: true
  # Realise the certified functional step by INTEGRATING toward it instead of
  # jumping at it. theta - eta u is only the first Gauss-Newton iteration of
  # "find theta' with f(theta') = f - eta g"; shrinking eta until that single
  # iteration is accurate shrinks the functional movement by the same factor
  # (MEASURED at 512x and 2047x), which is what stalled this run. Integrating
  # keeps each sub-step short where the linearisation is used while delivering
  # the FULL eta g the certificate licensed. MEASURED, same direction and
  # certificate: loss 9.580e1 -> 8.567e1 against 9.576e1 for one jump -- 236x,
  # realising 96.2 % of the intended displacement.
  # eta at the ARGMAX of Lemma 3.5's guaranteed decrease, not at the edge of
  # the interval. The bound's bracket vanishes at eta_bar, so the guaranteed
  # decrease eta*bracket(eta) is a parabola peaking at eta_bar/2. Taking 0.95
  # of the interval maximises the step and minimises what it buys; for
  # sum-MSE it gives f_new - y = -0.9(f - y), an error that flips sign and
  # shrinks only 10 % per step. MEASURED with the full step delivered: 0.95
  # sent train_loss 0.0917 -> 0.3991 and validation accuracy 0.248 -> 0.123.
  certify_optimal_rate: true
  # This comment used to read "nothing to resample: probe_batches covers the
  # entire training set". It is FALSE here too: probe_batches 11 * batch_size
  # 64 = 704 of mnist_train_samples 10000, i.e. 7%. The base is the sample the
  # certified steps are FITTED on, so with it fixed they interpolate it and it
  # stops standing for the population. MEASURED on this very config
  # (runs/log/convA.log), probe functional per image against full-train
  # functional per image: 3.72x at the first transaction, 9.40x by the 25%
  # mark, and 9.74x at the end. The linear config reached 14.2x at 1.4%
  # coverage, so the two agree: the smaller the fraction, the worse the bias.
  #
  # probe_resample stays false because it rebuilds the WHOLE probe and would
  # discard the counterexamples with it. certify_probe_base_resample redraws
  # the base and keeps the counterexample memory, which is where the
  # monotonicity the refinement relies on actually has to hold.
  probe_resample: false
  certify_probe_base_resample: true
  certify_realize_path: true
  # Adaptive early stop: 138 of ~200 steps ran the full 40 inner solves without
  # reaching tolerance, but the late iterations barely move the residual. Stop
  # once an iteration reduces it by < 0.5% of the intended displacement -- the
  # certified direction and rate are untouched, only how far the fixed target
  # is chased. Measured to keep test ~0.93 at a fraction of the inner cost.
  certify_realize_min_progress: 0.005
  # Certified family ladder: nonlinear within-MLP family before growing,
  # accepted only by its OWN Crel<1/2. Makes FP growth affordable
  # (MEASURED 57->6 growths on the synthetic task).
  certify_family_ladder: true
  certify_family_inner_steps: 400
  certify_family_inner_learning_rate: 0.01
  certify_family_functional_lr: 1.0
  # Barrido ASCENDENTE de la distancia funcional de la familia. Cada eta_f
  # certifica por su propio RelErr(Delta,r) < min(threshold, 0.5) sobre la
  # misma sonda; eta_f=1 va primero, asi que una corrida que certifica ahi es
  # identica a antes y al mismo coste. MEDIDO: descendente pierde (0.8823),
  # ascendente gana (0.9230 contra 0.9000 del baseline).
  certify_family_functional_lrs: [1.0, 2.0, 4.0, 8.0]
  certify_realize_max_iterations: 40
  certify_realize_tolerance: 0.05
  # Freeze the Gauss-Newton Gram across the inner realise iterations: build
  # J^T J once (first inner iteration) and recompute only J^T shortfall (one
  # VJP) each iteration -- the modified-Newton (chord) method. Same certified
  # direction/rate/target and the same residual-reducing line search; only the
  # preconditioner is held fixed. VALIDATED on this config: test 0.936/0.934 vs
  # baseline 0.935/0.932 (parity), realise iters 5.34 vs 5.47, 0 NaN, and 28%
  # faster wall-clock even here where the Jacobian is cheap (far more on CIFAR,
  # where the per-iteration full Jacobian dominates).
  certify_realize_freeze_gram: true
  # Matrix-free-only transaction: verify the nonlinear endpoint on the SAME
  # full training probe before it can commit. Rejected endpoints are restored
  # to the one pre-step checkpoint and retried from there at half the rate.
  transactional_realized_descent: true
  transactional_max_retries: 3
  transactional_backtrack_factor: 0.5
  transactional_descent_atol: 1.0e-10
  # Start with strict observed descent. The stronger predicted-decrease
  # fraction remains available, but is deliberately not imposed until the
  # scalar diagnostics from the validation run have calibrated it.
  transactional_min_predicted_decrease_fraction: 0.0
  # Applied in select_projection_damping_factored: the certificate's proposal
  # is still logged unchanged, while only the attempted/committed rate is
  # capped. The dense exact selector never reads this field.
  certify_functional_lr_cap: 0.1
  tangent_measured_descent: false
  # ===================== CRITERIO DE CRECIMIENTO =====================
  # DONDE crecer: la capa con el mayor CUELLO DE BOTELLA DE EXPRESIVIDAD,
  # es decir el argmax de activation_gradient * sum(eigenvalues_extension^2)
  # -- el termino de extension de TINY, la masa del cambio funcional deseado
  # que cae FUERA de lo que el ancho actual puede expresar. NO es el
  # select_best_update de TINY: ese suma parameter_update_decrease, que mide
  # cuanto ganaria reajustar los pesos EXISTENTES y por tanto habla de
  # entrenamiento, no de ancho. Una neurona por evento, en esa capa.
  #
  # MEDIDO en N=1024, 4 semillas, 600 parametros, a igualdad de computo:
  #   certified_gain          0.9230   formas 15-16-15 en 3 de 4 semillas
  #   expressivity_bottleneck 0.9435   4 formas distintas, ratios 1.46-2.44
  # Las cuatro semillas superan 0.925 individualmente.
  # Both from config 2, and both absent from config 1 (so they defaulted off).
  # certify.py's while-loop reads only `epsilon >= target`, and the lookahead
  # that DOES look at the band could previously only return "no": a brake with
  # no accelerator. The entry flag lets the same predicate authorise growth,
  # bounded by construction to one neuron per outer step.
  certify_growth_lookahead: true
  certify_growth_lookahead_entry: true
  growth_where: expressivity_bottleneck
  # WHERE remains the Conv expressivity bottleneck. The live convA run reached
  # eps ~= 9e-4, then repeated rejected full-train transactions, LINEAR -> none
  # (or eta ~= 4e-5), and no-growth-reduced-eps while epochs 4-8 were identical.
  # Value the one function-preserving bottleneck growth by the certified
  # finite functional progress it can actually execute. This is not a forced
  # growth and does not alter the convolutional architecture or its WHERE rule.
  certify_realizable_progress_growth: true
  # The live seed-0 Conv run measured the same finite contradiction as full
  # MNIST: the bounded probe fell while the frozen 10000-example objective
  # rose for every transactional rate. At P=3080, NK/rank remained healthy
  # (~5.03), so this is statistical probe bias rather than algebraic
  # interpolation. Retain the worst unseen full-train batch, rebuild the
  # tangent system at the unchanged theta, and retry the same logical step.
  # The finite 16-round cap matches full MNIST and prevents a retry deadlock.
  certify_probe_refine_on_transaction_mismatch: true
  certify_probe_refine_batches_per_round: 1
  certify_probe_refine_max_rounds: 16
  # ...and a ROW budget, because the round cap is TERMINAL: once spent the
  # mechanism is off for the rest of the run and the probe drifts back into the
  # 9.74x bias above. MEASURED on the linear sibling (yqfvy8l7):
  # "stop_reason=probe_refinement_exhausted round=16 max_rounds=16" at epoch 6
  # with mismatches still firing every outer step. What costs is the probe SIZE,
  # so the honest budget bounds the memory by rows and evicts the least
  # violating counterexample instead of terminating. 2560 = 4 batches * 64
  # images * K 10, scaled to this config's smaller probe and 5000-parameter
  # budget rather than copied from the linear one.
  certify_probe_refine_max_rows: 2560
  # Insurance, not a fix here. rank(J) <= min(NK, P), so NK > P forbids the
  # spurious eps; the linear config crossed that floor and read eps 0.009 while
  # validation said 1.02. This config does not cross it TODAY -- P is capped at
  # 5000 and NK starts at 7040 -- but the sizing that let it happen there is the
  # same sizing running here, so the floor goes in before the budget ever moves.
  certify_probe_parameter_floor: 1.25
  # Let a NEW LAYER compete with the widenings, in the same measured
  # bottleneck per parameter. This is the B arm; false is the A arm and runs
  # the width-only branch exactly as before.
  growth_where_balance: false
  # NO INERTE, verificado por medicion: quitarla movio s0 y s3 (s3 de 0.958 a
  # 0.896). Se lee en DOS sitios y solo uno depende del modo:
  #   pipeline.py  la rafaga del bloque de crecimiento por epoch -- APAGADA
  #                bajo expressivity_bottleneck (una neurona por evento)
  #   certify.py   la rafaga dentro de grow_until_certified, que compra en la
  #                ubicacion ya elegida mientras cada incremento siga pagando
  #                en eps -- NO depende del modo, y es la que actua aqui
  certify_adaptive_growth: true
  certify_adaptive_growth_min_gain: 0.1
  # NO INERTES bajo expressivity_bottleneck, verificado por medicion: quitarlas
  # movio s0 y s3 (s3 de 0.958 a 0.896, perdiendo la forma 9-16-22). No pasan
  # por el ranking del cuello de botella, actuan ANTES:
  #   growth_select_by_descent  decide si el crecimiento se dispara siquiera
  #                             (pipeline.py, fgd_growth_probe_improved)
  #   growth_prefer_lower_error elige entre sondas en _select_growth_probe,
  #                             antes de que existan los candidatos
  growth_select_by_descent: true
  growth_prefer_lower_error: true
  # ===================================================================
  growth_selection: unified_expansion
  # Generalised R1: eps < 1/2 is Lemma 3.5 step-admissibility, not structural
  # adequacy. Before stopping, check whether growing the bottleneck reaches a
  # strictly lower eps than training longer would (both clones trained the
  # same steps -- an apples-to-apples look-ahead). Verified a strict
  # generalisation: MNIST on==off (identical growths, 0 firings while eps>1/2).
  # Only pays its cost in the tail (eps<1/2), and reuses tiny_statistical_
  # threshold as the margin -- no new constant.
  growth_lookahead_adequacy: true
  # 2, config 2's value. At 10 the lookahead trains 3140 passes per question,
  # which commit aa53ca4 measured as 75% of the epoch. That cost is what makes
  # it unaffordable at MNIST scale, and this config is at MNIST scale.
  growth_lookahead_steps: 2
  # The fallback families must stay available once the structure becomes
  # adequate (eps < 1/2): otherwise growth correctly stops and the flow is
  # left with the tangent alone, which freezes it.
  families_available_without_growth: true
  local_acceptance_conditions: true
  eps: 1.0e-12
  # SUPERSEDED, kept at 0. The construction is no longer a low-rank sketch:
  # J J^T = A S^2 A^T gives J's EXACT spectrum from an NK x NK object, where
  # the primal J^T J is P x P. MEASURED at P=19201: 8.4 MB / 0.020 s against
  # 2949 MB / 0.235 s, exact to 2.4e-16.
  #
  # Low rank was tried first and cannot work on this problem: r is spread
  # across the whole spectrum, so at P=1345 the exact eps is 1e-06 while a
  # rank-512 sketch reported 0.21. Nothing is truncated now beyond
  # numerically-zero singular values, which carry nothing by definition.
  matrixfree_rank: 0
  tiny_use_covariance: true
  tiny_alpha_zero: false
  tiny_omega_zero: false
  tiny_use_projection: true
  tiny_ignore_singular_values: false
  # MEASURED: leave this false. Enabling the output-side Kronecker factor
  # makes the score rank layer 2 top (37.7 vs 11.0 for layer 0) while the
  # scaling line search then rejects that very extension outright
  # (best_scaling = 0.000, train_loss 0.187 -- the WORST of the three). In
  # the end-to-end run 7 of 8 growth events took scaling 0, adding dead
  # parameters, so eps never improved, R1 re-fired every epoch and the run
  # stalled at 65.6%. The Fisher-preconditioned score was anti-correlated
  # with the realized outcome here.
  #
  # This is also the metric SENN's own theory states (their 3.4: "for the
  # purposes of simplicity we choose the euclidean metric, corresponding to
  # F := (1/N) J^T J"), and the one the bridge identity in
  # report/SENN_EXPANSION_SCORE.md is derived under. KFAC S (x) A is their
  # practical approximation to it, not the definition.
  tiny_use_fisher: false
  # ONE purchase per growth event -- one neuron or one layer. Maximum
  # resolution, and every structural step is attributable to a single
  # measured certificate, which is what the ranking by Delta(N eta)/cost
  # compares. At 4 the input projection was bought 4 neurons at a time
  # (+3180 parameters per event) and overshot to ~7175 before Lemma 3.5
  # stopped it.
  tiny_maximum_added_neurons: 1
  tiny_numerical_threshold: 1.0e-6
  tiny_statistical_threshold: 1.0e-3
  # FUNCTION-PRESERVING GROWTH. Two flags govern two DIFFERENT growth
  # mechanisms, and both are function-preserving for the certified method:
  #   * certify_function_preserving (below) drives the grow-to-certify loop.
  #   * growth_function_preserving (this flag) drives the standard growth path.
  # The certified method's ACTIVE growth -- grow-to-certify and the unified /
  # rank-cap expansion (growth_selection: unified_expansion) -- is
  # function-preserving BY DESIGN (the theory needs f unchanged so the
  # certified steps do all the descent), and the unified path enforces that
  # regardless of this flag. This flag only affects the LEGACY SENN / uniform /
  # expansion-per-parameter paths, which this config never runs. It is set
  # true so the config reads honestly as function-preserving throughout and is
  # never mistaken for a non-FP run (the previous `false` here was an inert,
  # misleading inheritance).
  growth_function_preserving: true
  growth_requires_admissibility_failure: true
  # kappa = 4: size the probe so NK = 4 * rank(J) AS THE NET GROWS, instead
  # of trusting a hand-picked probe to stay above the interpolation floor.
  # Below that floor eps collapses to a spurious 0 and the certificate is
  # vacuous. probe_batches above is only the starting point. [4, 8] is the
  # documented range. From config 2 (mnist_matrix_free.yaml) -- it is a
  # data-size knob, and this config runs on the same data.
  certify_probe_kappa: 4.0
  # Observe the already-built matrix-free system without changing probe
  # sizing. The previous measurements put NK/rank at 23-35 for Conv; keep that
  # invariant visible beside eps in the cluster run.
  certify_probe_diagnostics: true
  # An INSTRUMENT, not a solution. The kappa floor turns out NOT to be what
  # binds here, and the reason is worth recording because it is the opposite
  # of the linear case: MEASURED on this stack, rank(J) FALLS as the net
  # grows -- 307 at P=498, 236 at P=974, 199 at P=1450 -- because a
  # convolution shares its weights, so the Jacobian's rank is limited by the
  # data and the spatial structure rather than by the parameter count. In the
  # linear ladder rank tracks P and the probe has to chase it; here NK = 7040
  # against rank ~200-300 leaves NK/rank at 23-35, far above the floor of 4.
  #
  # What binds is TIME, not the certificate: one tangent solve costs 4.2 s at
  # P=544 and 25.5 s at P=1450, six times over, and an epoch spends about 24
  # of them.
  #
  # 5000, config 2's value, for the same reason the sample count is.
  #
  # A tighter cap was tried and it was the WRONG TRADE, measured: at 1000 the
  # run reached 996 parameters by epoch 2 and then spent every epoch unable to
  # grow, eps parked at 0.4997-0.5000 -- the same stall a cap produces in the
  # linear ladder -- and accuracy froze at 0.349 against the 0.673 the same
  # flow reached with room. A budget that changes the ANSWER is not an
  # instrument, whatever it saves in wall clock.
  max_total_parameters: 5000
  # Also from config 2: the streamed Gram is for the flat-MNIST widths.
  certify_stream_gram: false
  # GroMo's crossfold bottleneck test CANNOT MEASURE on conv: its fitted
  # extension matrix assumes two linear layers, and with 4-D alpha/omega the
  # guard returns None, the significance comes back inf, and inf > 1 approves
  # every candidate. It would look live while being a no-op, which is worse
  # than being off. 0 disables it, and a test pins the inf so the fact is
  # recorded rather than rediscovered.
  growth_bottleneck_crossfold_folds: 0
  # Conv-specific float32 roundoff floor. Widening installs exactly-zero
  # outgoing weights, so the represented function is unchanged algebraically,
  # but changing a convolution's channel shape can change cuDNN's reduction
  # order. MEASURED on margpu008: relative drift 1.281e-6
  # (4.888e-6 / output scale 3.815) tripped the MLP-oriented 1e-6 guard and
  # aborted seed 0. 1e-5 is still a strict five-significant-digit invariant
  # and matches the Conv insertion tests; linear and N1024 retain 1e-6.
  growth_preservation_tolerance: 1.0e-5
  # Ordered ladder of approximation families, evaluated top to bottom.
  # "tangent" must come first (it is the epoch's main transactional
  # search). Each following family is consulted only after every family
  # above it fails to certify, and structural growth is probed only after
  # ALL listed families fail. Every family commits through the same full
  # FGD certificate (Crel, LR interval, descent, Cstat, Cglob).
  # Uncomment a family to enable it, same pattern as
  # growth_function_preserving:
  family_order:
    - matrix_free_tangent
  # In-ladder rkhs_head margin: the head must improve the FULL validation
  # functional by this relative amount (filters the train-subsample jitter
  # that otherwise re-accepts an epsilon improvement forever).
  rkhs_family_min_relative_improvement: 1.0e-3

# Parametric-GD secant family. Only consulted when "parametric_gd" is
# listed in fgd_approx.family_order. A disposable clone is trained
# parametrically toward the functional target f - eta*r; the realized
# output displacement Delta = F(base) - F(candidate) is screened on
# validation by its directional cosine against the functional gradient
# (min_cosine) and then certified at the scale-optimal declared rate
# eta* = <Delta, r> / |r|^2, which is the fix for the historical scale
# mismatch of this family. With eta* the best achievable relative error
# is exactly sqrt(1 - cos^2), so cosines below sqrt(1 - 0.5^2) = 0.866
# can never satisfy Crel < 0.5: candidates that fail the screen are
# discarded BEFORE certification and the ladder simply moves on, so a
# misaligned family can no longer push the flow into nonstop growth.
# Measured on MNIST (widths 2-16, fresh and mid-training): best cosine
# ~0.8 -> minimal RelErr ~0.6 > 0.5, so expect this family to decline
# on MNIST at these widths; it is safe to enable and only fires when
# its projection is genuinely admissible.
parametric_gd:
  optimizer: sgd            # sgd | adam (adam measured consistently less aligned)
  inner_learning_rate: 0.05
  inner_steps: [16, 64]     # coarse-to-fine inner budgets per candidate
  functional_learning_rates: [0.2, 0.05]
  min_cosine: 0.9           # mathematical floor for Crel<0.5 is 0.866
  parameter_penalty: 1.0e-6
  gradient_clip_norm: 1.0

# Measured-descent parametric family. Only consulted when
# "parametric_descent" is listed in fgd_approx.family_order. Same candidate
# generation and eta* calibration as parametric_gd, but acceptance follows
# Prop. 3.8 with the descent coefficient MEASURED on validation instead of
# lower-bounded through the relative error: for the empirical sum-MSE
# functional the function-space PL inequality is the exact identity
# |grad L|^2 = 4 L (the configured theory_mu = 2, theory_loss_star = 0), so
# the global contraction G_T <= prod(1 - 2 eta mu r_t) G_0 holds with
# r_t = (L_t - L_{t+1}) / (eta* |grad L_t|^2) and equals the realized loss
# ratio exactly. Crel and the LR interval are NOT gates here (they are one
# sufficient mechanism, which the measurement replaces); the secant relative
# error is still logged as a diagnostic. Cprog (min_progress), Cstat and
# Cglob use the same accumulators as every other family. Because a merely
# descending step certifies, this family fires where parametric_gd declines;
# per-step it certifies realized progress rather than near-gradient
# direction.
parametric_descent:
  optimizer: adamw
  inner_learning_rate: 0.003
  inner_steps: [40]
  # 0.5 makes the functional target exactly y (plain parametric loss descent).
  functional_learning_rates: [0.5]
  weight_decay: 0.05
  min_cosine: 0.0           # 0 = only require a descent direction (eta* > 0)
  parameter_penalty: 1.0e-6
  gradient_clip_norm: 1.0
  # Cprog floor on eta* r_t = D_t / |grad L_t|^2 (= D/4L): every accepted
  # step must remove at least 4*min_progress of the remaining loss (1e-3 =
  # 0.4% per step). Steps below it are REJECTED, marking the structure
  # exhausted for this family so growth takes over. This is the family's
  # only binding gate besides measured descent: its Cglob envelope is tight
  # by construction and Cstat loosens as steps shrink, so set this floor to
  # the smallest per-step progress you consider worth an epoch. 1e-6
  # stagnated MNIST 3x2 at ~40% accuracy on certified crumbs.
  min_progress: 1.0e-4

# Tangent projection only: the certified RKHS head phase is off, so the
# growth_min_* thresholds below still govern the growth probe gate.
# (With "rkhs_head" listed in family_order the phase runs as an in-ladder
# family regardless of this flag.)
secant_fgd:
  enabled: false
  inner_steps: 8
  inner_learning_rate: 0.01
  parameter_penalty: 1.0e-6
  gradient_clip_norm: 1.0
  search_steps: 3
  max_learning_rate: 0.1
  min_learning_rate_factor: 0.01
  growth_min_relative_error_improvement: 0.001
  growth_min_learning_rate_improvement: 0.05

fgd_rkhs:
  feature_whitening: true
  epsilon: 0.25
  lr_safety: 0.9
  steps_per_epoch: 10
  max_train_points: 4096
  growth_epochs_per_cycle: 30

# Ignored while growth_function_preserving is true (the extension is applied
# with fixed scaling 1.0 and zero outgoing weights); kept for compatibility.
scaling_line_search:
  method: golden_section
  min_value: 0.0
  max_value: 1.0
  iterations: 12
  tolerance: 0.001

# NOT a schedule under method: fgd_approx. Only `enabled` is read here, as
# a master on/off switch for architecture changes; `every`, `first_epoch`
# and `layer_policy` are consulted exclusively by method: normal. Growth
# timing comes from the certificate alone -- Lemma 3.5 (eps >= 0.5) proposes
# it and R1 (eps no longer decreasing) decides whether training may render
# the proposal unnecessary. should_trigger_fgd_growth() opens with
# `del epoch, last_growth_epoch`: no epoch, dwell or cap participates.
growth_schedule:
  enabled: true
  every: 100
  first_epoch: 50
  layer_policy: round_robin

wandb:
  enabled: true
  project: stable-tiny
  entity:
  run_name:
  group: mftangent-ladder-N1024
  job_type: train
  tags: [fgd_approx, certified_growth, smooth_sin_tiny, from_3x2, mse, lemma35_cycle, matrix_free, transactional, exact_dual_spectrum]
  notes: Matrix-free tangent with exact dual spectrum and transactional realized-training-functional descent; the dense exact ladder remains untouched.
  mode: online
  dir: results
  log_code: false

# --- Matrix-free operator solver knobs ---
parametric_gd:
  cg_tolerance: 1.0e-10
  # Accumulate this many examples per autograd call. NOT a hyperparameter:
  # J and r are sums over examples. MEASURED at N=1024, eps agreed to 6
  # significant figures across 64/128/256/512/1024 while the solve went
  # 0.62s -> 0.06s -- pure call overhead, since Krylov is sequential.
  matrixfree_batch_size: 256
